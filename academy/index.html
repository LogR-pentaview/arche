<style>
:root{
  --bg:#f2f4f6; --panel:#fff; --panel-2:#f4f6f8; --panel-3:#e5e8eb;
  --line:#e5e8eb; --line-soft:#eef1f4;
  --ink:#191f28; --ink-dim:#4e5968; --ink-mute:#8b95a1;
  --brand:#3182f6; --brand-2:#1b64da;
  --safe:#12b76a; --reach:#f79009; --risk:#f04452; --violet:#7c3aed; --mint:#0bb8a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ===== 로그인 게이트 ===== */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef3fb,#f2f4f6 60%);padding:20px;z-index:100}
.gate .card{width:100%;max-width:380px;background:#fff;border-radius:22px;box-shadow:0 30px 70px -30px rgba(20,26,41,.4);padding:34px 30px}
.gate .blogo{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;text-align:center}
.gate .bname{font-size:26px;font-weight:900;text-align:center;margin-top:6px;letter-spacing:-.02em}
.gate .btag{font-size:12.5px;color:var(--ink-mute);text-align:center;margin-top:6px}
.gate .badge{display:block;text-align:center;margin:18px auto 4px;font-size:11px;font-weight:800;color:var(--brand-2);background:#e8f1ff;border-radius:20px;padding:6px 12px;width:fit-content}
.gate input{width:100%;margin-top:10px;padding:13px 15px;background:var(--panel-2);border:1.5px solid transparent;border-radius:12px;font-size:14px;color:var(--ink);outline:none}
.gate input:focus{border-color:var(--brand)}
.gate .go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:15px;font-weight:800}
.gate .go:active{transform:scale(.99)}
.gate .msg{font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}
.gate .msg.err{color:var(--risk)}
.gate .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-mute);line-height:1.7}
.gate .foot a{color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line)}

/* ===== 앱 셸 ===== */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line-soft);padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side::-webkit-scrollbar{width:5px}.side::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;flex:none}
.brand .nm{font-size:16px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.brand .rl{font-size:9.5px;letter-spacing:.14em;color:var(--ink-mute);text-transform:uppercase;margin-top:2px}
.navlabel{font-size:9.5px;letter-spacing:.15em;color:var(--ink-mute);text-transform:uppercase;padding:14px 10px 5px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--ink-dim);font-size:13px;font-weight:500;transition:.13s;border:1px solid transparent}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.nav:hover{background:rgba(25,31,40,.05);color:var(--ink)}
.nav.on{background:linear-gradient(90deg,rgba(49,130,246,.13),rgba(49,130,246,.03));color:var(--ink);border-color:rgba(49,130,246,.22);font-weight:700}
.nav.on svg{opacity:1;color:var(--brand)}
.nav .tag{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--violet);border-radius:6px;padding:2px 6px}
.nav .tag.new{background:var(--mint)}
.side .sp{flex:1}
.side .who{border-top:1px solid var(--line-soft);margin-top:10px;padding-top:12px;font-size:12px;color:var(--ink-dim)}
.side .who b{color:var(--ink)}
.side .out{margin-top:8px;font-size:12px;color:var(--ink-mute);background:none;border:0;padding:4px 2px;text-align:left}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:20}
.topbar .t{font-size:15px;font-weight:800}
.topbar .sp{flex:1}
.topbar .stusel{font-size:12.5px;font-weight:600;color:var(--ink-dim);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.topbar .live{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7B1FA2,#E91E63);border-radius:8px;padding:7px 12px;border:0;display:flex;align-items:center;gap:6px}
.topbar .live .dot{width:6px;height:6px;border-radius:50%;background:#4FFFB0;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.wrap{padding:26px;max-width:1080px;width:100%}

.view{display:none}
.view.on{display:block}
.h1{font-size:22px;font-weight:900;letter-spacing:-.02em}
.h1 .sub{display:block;font-size:12.5px;font-weight:500;color:var(--ink-mute);margin-top:4px}
.grid{display:grid;gap:14px;margin-top:18px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g3,.g4,.g2{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.card .k{font-size:11.5px;font-weight:700;color:var(--ink-mute);letter-spacing:.02em}
.card .v{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:-.02em}
.card .v small{font-size:13px;font-weight:700;color:var(--ink-mute)}
.card .d{font-size:11.5px;color:var(--ink-dim);margin-top:4px}
.mount{margin-top:18px;min-height:120px}
.ph{border:1.5px dashed var(--line);border-radius:14px;padding:30px 24px;text-align:center;background:#fff;margin-top:16px}
.ph .pi{font-size:30px}
.ph .pt{font-size:15px;font-weight:800;margin-top:8px}
.ph .pd{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.6}
.ph .pw{display:inline-block;margin-top:12px;font-size:11px;font-weight:800;color:var(--reach);background:#fff7ed;border:1px solid #ffe8cc;border-radius:8px;padding:5px 11px}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tab{font-size:12.5px;font-weight:700;color:var(--ink-dim);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mobbar{display:none}
@media(max-width:720px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:.2s;z-index:60;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .mobbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:30}
  .mobbar .mb{font-size:22px;background:none;border:0}
  .wrap{padding:18px}
}
</style>

<script>
/* =========================================================================
   펜타 학원용(B2B2C) 셸 — 골격 v0.1
   -------------------------------------------------------------------------
   · 테넌트 인식: <slug>.penta-view.com → 학원 브랜딩 자동 로드 (RPC)
   · 학원 전용 로그인 + 하드 가드: 학원 소속(원장/강사/학생/부모)만 통과
   · 역할별 대시보드: 원장 / 강사 / 학생 / 학부모(수강생 부모)
   · 유지 모듈: 원장 대시보드 · 진로 징검다리 · 수행평가 도우미
   · 신규 모듈: 실시간 강의실(관제+판서+조편성) · 코스웨어
   · 미리보기: ?preview=owner|staff|student|parent  (로그인 없이 셸 구조 확인)
   ========================================================================= */

/* ---- Supabase 클라이언트 (config.js의 전역 SB_URL/SB_KEY 재사용) ---- */
var _SBU = window.SB_URL || 'https://dvxepjctjazobrkjrkdw.supabase.co';
var _SBK = window.SB_KEY || '';
var sb = (window.supabase && _SBK) ? window.supabase.createClient(_SBU, _SBK) : null;

/* ---- 실시간 강의실 표기명 (한 곳에서 변경) ---- */
var LIVE_LABEL = '실시간 강의실';   // 대안: '라이브 클래스룸' · '실시간 수업' · '수업 현황판'

/* ---- 상태 ---- */
var ST = { role:null, academy:null, user:null, brand:null, view:null };
try{ window.__shellST = ST; }catch(e){}  /* 디버그/미리보기용 노출 */

/* ---- 테넌트 슬러그 (서브도메인) ---- */
function tenantSlug(){
  // 개발/미리보기 오버라이드: ?tenant=<slug> (실제 서브도메인 없이 브랜딩 검증용)
  var q = new URLSearchParams(location.search).get('tenant');
  if(q) return q.trim().toLowerCase();
  var h = location.hostname;
  if(/^(localhost|127\.|arche\.|www\.|penta-view\.com)/.test(h)) return null;
  var m = h.split('.'); // <slug>.penta-view.com
  if(m.length>=3 && m[1]==='penta-view') return m[0];
  return null;
}

/* ---- 학원 브랜딩 로드 (로그인 전) ---- */
async function loadBrand(){
  var slug = tenantSlug();
  var qp = new URLSearchParams(location.search);
  var b = { name:'펜타 학원', color:'#3182f6', logo:null, tag:'생각하는 힘을 키우는 수업', id:null };
  // 1) 운영: 슬러그 → RPC로 학원 브랜딩 로드
  if(slug && sb){
    try{
      var r = await sb.rpc('academy_brand_by_slug', { p_slug: slug });
      if(r.data && r.data[0]){
        var a=r.data[0];
        b.name = a.brand_name || a.name || b.name;
        b.color = a.brand_color || b.color;
        b.tag = a.tagline || b.tag;
        b.logo = a.logo_url || null;
        b.id = a.id;
      }
    }catch(e){}
  }
  // 2) 미리보기 오버라이드(?brandName·?brandColor·?tag) — 배포 전 시각 확인용
  if(qp.get('brandName')) b.name = qp.get('brandName');
  if(qp.get('brandColor')) b.color = qp.get('brandColor');
  if(qp.get('tag')) b.tag = qp.get('tag');
  ST.brand=b;
  applyBrand(b);
  return b;
}
function applyBrand(b){
  document.documentElement.style.setProperty('--brand', b.color);
  // 학원 브랜딩이면 우리(PENTA) 워드마크 숨김 → 학원 전용 사이트 느낌
  var branded = (b.name && b.name !== '펜타 학원');
  var gl = document.getElementById('g-logo');
  gl.textContent = branded ? '' : 'PENTA ACADEMY';
  gl.style.display = branded ? 'none' : 'block';
  if(b.logo){
    gl.style.display='block';
    gl.innerHTML = '<img src="'+b.logo+'" alt="" style="height:34px;object-fit:contain">';
  }
  document.getElementById('g-name').textContent = b.name;
  document.getElementById('g-tag').textContent = b.tag;
  document.getElementById('s-name').textContent = b.name;
  document.getElementById('s-mark').textContent = (b.name||'A').trim().charAt(0);
  document.title = b.name;
}

/* ---- 역할 해석: 원장 / 강사 / 학생 / 학부모 ---- */
async function resolveMembership(user){
  // 1) 원장(학원 소유자)
  try{
    var { data:owned } = await sb.from('academies').select('id,name,slug').eq('owner_uid', user.id).limit(1);
    if(owned && owned[0]) return { role:'owner', academy:owned[0] };
  }catch(e){}
  // 2) 강사(academy_users)
  try{
    var { data:au } = await sb.from('academy_users').select('academy_id,role').eq('uid', user.id).limit(1);
    if(au && au[0]){
      var { data:ac } = await sb.from('academies').select('id,name,slug').eq('id', au[0].academy_id).limit(1);
      return { role:(au[0].role==='owner'?'owner':'staff'), academy:(ac&&ac[0])||null };
    }
  }catch(e){}
  // 3) 학생(수강생)
  try{
    var { data:stu } = await sb.from('students').select('id,name,academy_id,grade,class_id').eq('auth_uid', user.id).limit(1);
    if(stu && stu[0]){
      var { data:ac2 } = await sb.from('academies').select('id,name,slug').eq('id', stu[0].academy_id).limit(1);
      return { role:'student', academy:(ac2&&ac2[0])||null, student:stu[0] };
    }
  }catch(e){}
  // 4) 학부모(수강생 부모) — parent_accounts 연동 (스켈레톤: 존재 시)
  try{
    var { data:pa } = await sb.from('parent_accounts').select('*').eq('auth_uid', user.id).limit(1);
    if(pa && pa[0]) return { role:'parent', academy:null, parent:pa[0] };
  }catch(e){}
  return { role:null, academy:null };
}

/* ========================= 셸 렌더 ========================= */
function svg(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'+p+'</svg>'; }
function renderShell(){
  var role = ST.role;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('s-role').textContent = (ROLE_KO[role]||'') + ' · ACADEMY';
  document.getElementById('s-who').textContent = (ST.user && ST.user.email) || (ST.preview?('미리보기('+ROLE_KO[role]+')'):'—');

  // 사이드바
  var nl = document.getElementById('navlist'); nl.innerHTML='';
  (NAV[role]||[]).forEach(function(it){
    if(it.sec){ var l=document.createElement('div'); l.className='navlabel'; l.textContent=it.sec; nl.appendChild(l); return; }
    var d=document.createElement('div'); d.className='nav'; d.dataset.v=it.v;
    d.innerHTML=svg(IC[it.i]||IC.home)+' <span>'+it.t+'</span>'+(it.tag?('<span class="tag '+(it.tag==='LIVE'?'':'new')+'">'+it.tag+'</span>'):'');
    d.onclick=function(){ go(it.v); if(window.innerWidth<=720) document.getElementById('side').classList.remove('open'); };
    nl.appendChild(d);
  });

  // 강사/원장이면 상단 학생선택 + 라이브 버튼 + 기존 컨설팅 화면 링크
  var isTeacher = (role==='owner'||role==='staff');
  var lg=document.getElementById('s-legacy'); if(lg) lg.classList.toggle('hidden', !isTeacher);
  document.getElementById('top-stusel').classList.toggle('hidden', !isTeacher);
  document.getElementById('top-live').classList.toggle('hidden', !isTeacher);
  document.getElementById('top-live').onclick=function(){ go('live'); };

  // 첫 화면
  var first = (NAV[role]||[]).find(function(x){return x.v;});
  if(first) go(first.v);
}

function go(v){
  if(typeof stopActivityReport==='function') stopActivityReport();  // 뷰 전환 시 이전 보고 종료
  if(typeof stopLiveControl==='function') stopLiveControl();
  if(typeof stopStudentClass==='function') stopStudentClass();
  ST.view=v;
  document.querySelectorAll('#navlist .nav').forEach(function(n){ n.classList.toggle('on', n.dataset.v===v); });
  var meta = flatNav().find(function(x){return x.v===v;}) || {t:''};
  document.getElementById('top-title').textContent = meta.t;
  document.getElementById('mob-title').textContent = meta.t;
  var host = document.getElementById('views');
  host.innerHTML = renderView(v);
  mountView(v, host);
}
function flatNav(){ var o=[]; Object.keys(NAV).forEach(function(r){ NAV[r].forEach(function(x){ if(x.v)o.push(x); }); }); return o; }

function ph(icon, title, desc, wire){

}
function statCards(cards){
  return '<div class="grid g4">'+cards.map(function(c){

}

/* 뷰 진입 시 실제 모듈 마운트 */
function mountView(v, host){
  // 코스웨어(강사/원장): 배정·제출·리포트
  if(v==='course'){
    var el1=host.querySelector('#course-mount');
    if(!el1) return;
    if(window.ArchePentaApp && window.sb){
      try{ ArchePentaApp.mountRole(el1, 'staff'); }
      catch(e){ el1.innerHTML=phRaw('⚠️','코스웨어 로드 실패', (e&&e.message)||e); }
    } else {
      el1.innerHTML = phRaw('🔌','코스웨어 미연결','로그인(DB 연결) 후 배정·전송·리포트가 표시됩니다. 미리보기 모드에서는 비활성.');
    }
    return;
  }
  // 학생: 받은 워크북 수행
  if(v==='sworkbook'){
    var el2=host.querySelector('#penta-mount');
    if(!el2) return;
    if(window.ArchePentaApp && window.sb){
      try{ ArchePentaApp.mountRole(el2, 'student'); startActivityReport(); }
      catch(e){ el2.innerHTML=phRaw('⚠️','워크북 로드 실패', (e&&e.message)||e); }
    } else {
      el2.innerHTML = phRaw('🔌','워크북 미연결','로그인 후 전달받은 회차가 표시됩니다.');
    }
    return;
  }
  // 학생: 라이브 수업 참여 (판서 보기 + 워크북)
  if(v==='sclass'){
    var elc=host.querySelector('#sclass-mount');
    if(elc) mountStudentClass(elc);
    return;
  }
  // 학부모: 자녀 워크북·리포트 열람
  if(v==='pdash' || v==='preport'){
    var el3=host.querySelector('.mount');
    if(el3 && window.ArchePentaApp && window.sb){
      try{ ArchePentaApp.mountRole(el3, 'parent'); }catch(e){}
    }
    return;
  }
  // 학생·반 관리
  if(v==='members'){
    var el4=host.querySelector('#members-mount');
    if(el4) mountMembers(el4);
    return;
  }
  // 실시간 강의실 (관제 + 판서) — 강사/원장
  if(v==='live'){
    var el5=host.querySelector('#live-mount');
    if(el5) mountLiveControl(el5);
    return;
  }
  // 원장 대시보드 — 경영지표·재등록 방어
  if(v==='dash'){
    if(host.querySelector('#dash-stats')) mountDashboard(host);
    return;
  }
  // 학원 설정 — 전용주소(슬러그)·브랜드
  if(v==='settings'){
    var el6=host.querySelector('#settings-mount');
    if(el6) mountSettings(el6);
    return;
  }
}

            + (pa ? '<div style="font-size:11.5px;color:var(--ink-dim)">보호자 <b>'+esc(pa.login_id)+'</b></div>'
                  : '<button class="tab" data-parent="'+s.id+'" style="padding:3px 8px;font-size:10.5px;margin-top:3px">+ 보호자 계정</button>');
        } else {

        }

  function bind(){
    var cadd=host.querySelector('#m-cadd'); if(cadd) cadd.onclick=createClass;
    var sadd=host.querySelector('#m-sadd'); if(sadd) sadd.onclick=addStudent;
    host.querySelectorAll('[data-move]').forEach(function(sel){ sel.onchange=function(){ moveStudent(sel.getAttribute('data-move'), sel.value||null); }; });
    host.querySelectorAll('[data-ren]').forEach(function(b){ b.onclick=function(){ renameClass(b.getAttribute('data-ren'), b.getAttribute('data-nm')); }; });
    host.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ deleteClass(b.getAttribute('data-del')); }; });
    host.querySelectorAll('[data-delstu]').forEach(function(b){ b.onclick=function(){ removeStudent(b.getAttribute('data-delstu')); }; });
    host.querySelectorAll('[data-issue]').forEach(function(b){ b.onclick=function(){ issueAccount('create-student', b.getAttribute('data-issue'), b); }; });
    host.querySelectorAll('[data-parent]').forEach(function(b){ b.onclick=function(){ issueAccount('create-parent', b.getAttribute('data-parent'), b); }; });
  }

  async function issueAccount(fn, sid, btn){
    if(btn){ btn.disabled=true; btn.textContent='발급 중…'; }
    try{
      var sess=(await sb.auth.getSession()).data.session;
      var base=(window.FN_BASE)||((window.SB_URL||'')+'/functions/v1');
      var r=await fetch(base+'/'+fn, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+(sess?sess.access_token:''),'apikey':(window.SB_KEY||'')}, body:JSON.stringify({student_id:sid}) });
      var d=await r.json();
      if(d.error){
        if(d.need_code){ alert('학원 전용주소(슬러그)를 먼저 설정하세요.\n[학원 설정] → 전용주소에서 지정하면 그 주소가 아이디 접두가 됩니다 (예: samsung0001).'); }
        else if(d.need_student){ alert('먼저 학생 계정을 발급한 뒤 보호자 계정을 발급하세요.'); }
        else alert('발급 실패: '+d.error);
      } else {
        var who = fn==='create-parent' ? '보호자' : '수강생';
        if(d.existed) alert(who+' 계정이 이미 있습니다.\n아이디: '+d.login_id);
        else alert('✓ '+who+' 계정 발급 완료\n\n아이디: '+d.login_id+'\n초기 비밀번호: '+(d.pw||'0000')+'\n\n(학생·학부모는 이 아이디로 로그인 → 최초 로그인 시 비밀번호 변경)');
      }
      reload();
    }catch(e){ alert('발급 오류: '+((e&&e.message)||e)); if(btn){btn.disabled=false;} }
  }

  async function reload(){ await mountMembers(host); }

  async function createClass(){
    var nm=(host.querySelector('#m-cname').value||'').trim();
    var cap=parseInt(host.querySelector('#m-ccap').value,10)||10;
    var tid=host.querySelector('#m-cteacher').value||null;
    if(!nm){ alert('반 이름을 입력하세요.'); return; }
    try{ var r=await sb.from('academy_classes').insert({academy_id:acid, name:nm, capacity:cap, teacher_id:tid}); if(r.error)throw r.error; reload(); }
    catch(e){ alert('반 생성 실패: '+((e&&e.message)||e)); }
  }
  async function renameClass(id, cur){
    var nm=prompt('반 이름 수정', cur||''); if(nm==null) return; nm=nm.trim(); if(!nm) return;
    try{ var r=await sb.from('academy_classes').update({name:nm}).eq('id',id); if(r.error)throw r.error; reload(); }
    catch(e){ alert('수정 실패: '+((e&&e.message)||e)); }
  }
  async function deleteClass(id){
    if(!confirm('이 반을 삭제할까요? 소속 학생은 미배정으로 바뀝니다(학생 데이터는 유지).')) return;
    try{ var r=await sb.from('academy_classes').delete().eq('id',id); if(r.error)throw r.error; reload(); }
    catch(e){ alert('삭제 실패: '+((e&&e.message)||e)); }
  }
  async function addStudent(){
    var nm=(host.querySelector('#m-sname').value||'').trim();
    var gr=(host.querySelector('#m-sgrade').value||'').trim();
    var cid=host.querySelector('#m-sclass').value||null;
    if(!nm){ alert('학생 이름을 입력하세요.'); return; }
    try{ var r=await sb.from('students').insert({academy_id:acid, name:nm, grade:gr||null, class_id:cid}); if(r.error)throw r.error; reload(); }
    catch(e){ alert('학생 등록 실패: '+((e&&e.message)||e)); }
  }
  async function moveStudent(sid, cid){
    try{ var r=await sb.from('students').update({class_id:cid}).eq('id',sid); if(r.error)throw r.error;
      // 로컬 반영(카운트 갱신 위해 재로드)
      reload();
    }catch(e){ alert('반 이동 실패: '+((e&&e.message)||e)); }
  }
  async function removeStudent(sid){
    if(!confirm('이 학생을 명단에서 삭제할까요?')) return;
    try{ var r=await sb.from('students').delete().eq('id',sid); if(r.error)throw r.error; reload(); }
    catch(e){ alert('삭제 실패: '+((e&&e.message)||e)); }
  }
}

/* ========================= 원장 대시보드 (경영지표·재등록 방어) ========================= */
async function mountDashboard(host){
  var statEl = host.querySelector('#dash-stats'), riskEl = host.querySelector('#dash-risk'), moreEl = host.querySelector('#dash-more');
  if(!window.sb || !ST.academy){
    if(statEl) statEl.innerHTML = statCards([{k:'수강생',v:'—',s:'명'},{k:'반',v:'—',s:'개'},{k:'최근 7일 제출',v:'—',s:'건'},{k:'이탈 위험',v:'—',s:'명'}]);
    if(riskEl) riskEl.innerHTML = phRaw('🔌','미연결','로그인(DB 연결) 후 경영지표가 표시됩니다.');
    return;
  }
  var acid = ST.academy.id;
  if(statEl) statEl.innerHTML = statCards([{k:'수강생',v:'…'},{k:'반',v:'…'},{k:'최근 7일 제출',v:'…'},{k:'이탈 위험',v:'…'}]);
  var students=[], classesN=0, subs=[], acts=[], teachersN=0;
  try{
    var rs = await sb.from('students').select('id,name,created_at,class_id').eq('academy_id',acid);
    students = rs.data||[];
    var rc = await sb.from('academy_classes').select('id',{count:'exact',head:true}).eq('academy_id',acid);
    classesN = rc.count||0;
    var rsub = await sb.from('penta_submissions').select('student_id,status,updated_at,submitted_at:sent_at,created_at').eq('academy_id',acid).order('updated_at',{ascending:false}).limit(1000);
    subs = rsub.data||[];
    var rt = await sb.from('academy_users').select('uid',{count:'exact',head:true}).eq('academy_id',acid);
    teachersN = rt.count||0;
    if(students.length){
      var ids = students.map(function(s){return s.id;});
      var ra = await sb.from('student_activity_status').select('student_id,updated_at').in('student_id',ids);
      acts = ra.data||[];
    }
  }catch(e){ if(riskEl) riskEl.innerHTML = phRaw('⚠️','불러오기 실패',(e&&e.message)||e); return; }

  var now=Date.now(), WK=7*24*3600*1000, D21=21*24*3600*1000;
  // 최근 7일 제출 건수
  var recentSubs = subs.filter(function(s){ var t=s.updated_at||s.created_at; return t && (now-new Date(t).getTime())<WK; }).length;
  // 학생별 마지막 활동 = max(제출 updated_at, 관제 updated_at, 가입일)
  var lastByStu={};
  students.forEach(function(s){ lastByStu[s.id]= s.created_at? new Date(s.created_at).getTime():0; });
  subs.forEach(function(s){ var t=s.updated_at||s.created_at; if(t){ var k=String(s.student_id); if(lastByStu[k]!=null) lastByStu[k]=Math.max(lastByStu[k]||0, new Date(t).getTime()); } });
  acts.forEach(function(a){ if(a.updated_at && lastByStu[a.student_id]!=null) lastByStu[a.student_id]=Math.max(lastByStu[a.student_id]||0, new Date(a.updated_at).getTime()); });
  var risky = students.filter(function(s){ var l=lastByStu[s.id]||0; return (now-l) > D21; });

  if(statEl) statEl.innerHTML = statCards([
    {k:'수강생',v:students.length,s:'명',d:'등록 학생'},
    {k:'반',v:classesN,s:'개',d:'강사 '+teachersN+'명'},
    {k:'최근 7일 제출',v:recentSubs,s:'건',d:'워크북 제출'},
    {k:'이탈 위험',v:risky.length,s:'명',d:'3주+ 무활동'}
  ]);

  // 재등록 방어: 이탈 위험 학생 리스트
  if(riskEl){
    if(!students.length){ riskEl.innerHTML = phRaw('👥','학생 없음','[학생·반 관리]에서 학생을 먼저 등록하세요.'); }

async function refreshControl(){
  if(!window.sb || !_ctlClass) return;
  var acid = ST.academy.id;
  var students=[], acts=[];
  try{
    var rs = await sb.from('students').select('id,name,grade').eq('academy_id',acid).eq('class_id',_ctlClass).order('name');
    students = rs.data||[];
    if(students.length){
      var ids = students.map(function(s){return s.id;});
      var ra = await sb.from('student_activity_status').select('*').in('student_id',ids);
      acts = ra.data||[];
    }
  }catch(e){ return; }
  var amap={}; acts.forEach(function(a){ amap[a.student_id]=a; });

  // 집계
  var nOnline=0, nWork=0, nStag=0, nSubmit=0, alerts=[];
  students.forEach(function(s){
    var a=amap[s.id]; if(!a) return;
    var fresh = a.updated_at && (Date.now()-new Date(a.updated_at).getTime() < 30000);
    if(fresh) nOnline++;
    if(a.status==='working') nWork++;
    if((a.stagnation_sec||0)>=120){ nStag++; alerts.push('🔴 '+(s.name||'')+' 정체 '+Math.floor((a.stagnation_sec||0)/60)+'분'); }
    if((a.care_level||0)>=2) alerts.push('⚠️ '+(s.name||'')+' 케어 '+(a.care_level>=3?'긴급':'경고'));
    if(a.status==='submitted') nSubmit++;
  });
  var statHost=document.getElementById('ctl-stats'); if(!statHost) return;
  statHost.innerHTML = statCards([
    {k:'접속',v:nOnline,s:'/'+students.length,d:'최근 30초'},
    {k:'작성 중',v:nWork,s:'명'},
    {k:'정체',v:nStag,s:'명',d:'2분+'},
    {k:'제출',v:students.length?Math.round(nSubmit/students.length*100):0,s:'%'}
  ]) + (alerts.length?('<div class="card" style="margin-top:10px;border-color:#f0445233"><div style="font-size:12px;font-weight:800;color:var(--risk);margin-bottom:6px">주의</div>'+alerts.slice(0,6).map(function(a){return '<div style="font-size:12.5px;color:var(--ink-dim);margin:2px 0">'+esc(a)+'</div>';}).join('')+'</div>'):'');

  // 학생 카드
  var grid=document.getElementById('ctl-grid'); if(!grid) return;
  if(!students.length){ grid.className=''; grid.innerHTML=phRaw('👥','학생 없음','이 반에 배정된 학생이 없습니다.'); return; }
  grid.className='grid g4';
  var LB={working:['작성 중','#12b76a','#e9f9ef'],waiting:['대기','#f79009','#fff7e6'],stagnation:['정체','#f04452','#fdeaec'],submitted:['제출','#3182f6','#eaf1ff'],idle:['미접속','#9aa6b4','#f0f2f6']};
  grid.innerHTML = students.map(function(s){
    var a=amap[s.id]||{}; var st=a.status||'idle';
    var fresh = a.updated_at && (Date.now()-new Date(a.updated_at).getTime()<30000);
    if(!fresh) st='idle';
    if((a.stagnation_sec||0)>=120 && st==='working') st='stagnation';
    var L=LB[st]||LB.idle;
    var fill=a.fill_count||0, total=a.total_fill||0, pct=total?Math.round(fill/total*100):0;
    return '<div class="card" style="border-color:'+L[1]+'33">'
      +'<div style="display:flex;align-items:center;gap:8px"><b style="font-size:14px">'+esc(s.name||'-')+'</b>'
      +'<span style="margin-left:auto;font-size:10.5px;font-weight:800;color:'+L[1]+';background:'+L[2]+';padding:3px 9px;border-radius:20px">'+L[0]+'</span></div>'
      +'<div style="height:6px;background:var(--panel-3);border-radius:4px;margin-top:10px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+L[1]+'"></div></div>'
      +'<div class="d" style="margin-top:6px">작성 '+fill+'/'+total+' · '+((a.stagnation_sec||0)>=60?('정체 '+Math.floor((a.stagnation_sec||0)/60)+'분'):(esc(a.current_title||'대기')))+'</div>'
      +((a.care_level||0)>=2?'<div style="font-size:11px;font-weight:800;color:var(--risk);margin-top:6px">⚠️ 케어 '+(a.care_level>=3?'긴급':'경고')+'</div>':'')
      +'</div>';
  }).join('');
  var up=document.getElementById('ctl-updated'); if(up) up.textContent='업데이트 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ── 라이브 판서 (특성화고 엔진 이식 · 아르케 storage/app_settings 배선) ── */
function boardKey(classId){ return 'liveboard:'+(window._myUid||'')+':'+classId; }
async function boardWrite(classId, obj){
  try{ await sb.from('app_settings').upsert({ key:boardKey(classId), value:JSON.stringify(obj), updated_at:new Date().toISOString() }, { onConflict:'key' }); }
  catch(e){ console.warn('[판서 저장 실패]', e&&e.message); }
}
async function uploadBoardJpeg(dataUrl, classId, rev){
  try{
    var blob = await (await fetch(dataUrl)).blob();
    // 반당 파일 1개 고정 경로 → 덮어쓰기(누적 방지). 학생은 URL의 ?v=rev로 캐시 무효화.
    var path = (window._myUid||'t')+'/'+classId+'.jpg';
    var up = await sb.storage.from('liveboard').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
    if(up.error) throw up.error;
    var pub = sb.storage.from('liveboard').getPublicUrl(path);
    return pub.data.publicUrl;
  }catch(e){ console.warn('[판서 업로드 실패]', e&&e.message); return null; }
}
function openBoard(classId){

  var T = { pages:[{bg:null,ink:null}], idx:0, color:'#e5484d', width:3, erase:false, dirty:true, rev:0, timer:null, classId:classId, drawing:false, lastX:0,lastY:0, W:1280, H:720 };

    +'<button id="tb-close" style="font-size:12px;color:#fff;background:#EF5350;border:0;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:700">판서 종료</button>'
    +'</div>'
    +'<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto">'
    +'<div style="position:relative;width:min(96vw,1280px);aspect-ratio:16/9;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.5);border-radius:6px;overflow:hidden">'
    +'<canvas id="tb-bgc" width="1280" height="720" style="position:absolute;inset:0;width:100%;height:100%"></canvas>'
    +'<canvas id="tb-inkc" width="1280" height="720" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas>'
    +'</div></div>';
  document.body.appendChild(m);
  var ink=m.querySelector('#tb-inkc'), ictx=ink.getContext('2d'); ictx.lineCap='round'; ictx.lineJoin='round';
  function pos(e){ var r=ink.getBoundingClientRect(); return {x:(e.clientX-r.left)*(T.W/r.width), y:(e.clientY-r.top)*(T.H/r.height)}; }
  ink.addEventListener('pointerdown',function(e){ e.preventDefault(); T.drawing=true; var p=pos(e); T.lastX=p.x; T.lastY=p.y; try{ink.setPointerCapture(e.pointerId);}catch(_){} });
  ink.addEventListener('pointermove',function(e){ if(!T.drawing)return; e.preventDefault(); var p=pos(e); ictx.globalCompositeOperation=T.erase?'destination-out':'source-over'; ictx.strokeStyle=T.color; ictx.lineWidth=T.erase?T.width*4:T.width; ictx.beginPath(); ictx.moveTo(T.lastX,T.lastY); ictx.lineTo(p.x,p.y); ictx.stroke(); T.lastX=p.x; T.lastY=p.y; T.dirty=true; });

  async function broadcast(){
    if(!T.dirty) return; T.dirty=false;
    try{
      var ex=document.createElement('canvas'); ex.width=T.W; ex.height=T.H; var c=ex.getContext('2d');

  var pw=document.getElementById('g-pw').value||'';
  if(!email||!pw){ msg.className='msg err'; msg.textContent='이메일과 비밀번호를 입력하세요.'; return; }

    // 아이디(학생·학부모)면 @stu.penta-view.com 으로 변환, 이메일이면 그대로
    var loginEmail = (email.indexOf('@')>0) ? email : (email.toLowerCase()+'@stu.penta-view.com');
    var { data, error } = await sb.auth.signInWithPassword({ email:loginEmail, password:pw });
    if(error) throw error;
    await afterAuth(data.session.user);
  }catch(e){
    msg.className='msg err'; msg.textContent='로그인 실패: '+(e.message||e);
  }
}
async function afterAuth(user){
  var msg=document.getElementById('g-msg');
  var m = await resolveMembership(user);
  // 하드 가드: 학원 소속이 아니면 차단
  if(!m.role){
    msg.className='msg err';
    msg.innerHTML='이 계정은 학원 소속이 아닙니다. 일반 학부모는 <a href="/">아르케 홈</a>을 이용하세요.';
    try{ await sb.auth.signOut(); }catch(e){}
    return;
  }
  // (선택) 테넌트 슬러그가 있으면, 소속 학원과 일치하는지 검증 — 골격에선 경고만
  ST.user=user; ST.role=m.role; ST.academy=m.academy; ST.membership=m;
  setPentaGlobals();
  renderShell();
}

/* 코스웨어 엔진(ArchePentaApp) 의존 전역 세팅 */
function pentaRole(){ return ST.role==='student' ? 'student' : (ST.role==='parent' ? 'parent' : 'staff'); }
function setPentaGlobals(){
  window.sb = sb;
  window._acadId = (ST.academy && ST.academy.id) || null;
  window._academy = ST.academy || null;
  window._myUid = (ST.user && ST.user.id) || null;
  window._role = pentaRole();
  if(ST.role==='student' && ST.membership && ST.membership.student){
    var s=ST.membership.student;
    window._activeStudent = { id:s.id, name:s.name, grade:s.grade, class_id:s.class_id||null };
  }
}

/* ===== 배선 #2: 학생 워크북 진행상태 → 관제(student_activity_status) 보고 ===== */
var _actTimer=null, _actLastFill=-1, _actLastChange=Date.now();
function startActivityReport(){
  if(_actTimer) return;
  if(ST.role!=='student' || !window._activeStudent || !window.sb) return;
  _actLastChange=Date.now(); _actLastFill=-1;
  _actTimer = setInterval(reportActivity, 5000);
  reportActivity();
}
function stopActivityReport(){
  if(!_actTimer) return;
  clearInterval(_actTimer); _actTimer=null;
  reportActivity('idle');   // 수업 이탈 시 idle 1회
}
async function reportActivity(force){
  try{
    if(!window.sb || !window._activeStudent) return;
    var areas = document.querySelectorAll('.pnta textarea, .apw textarea, .pnta-ov textarea, #penta-mount textarea');
    var total = areas.length, fill = 0;
    areas.forEach(function(t){ if((t.value||'').trim().length>0) fill++; });
    var now = Date.now();
    if(fill !== _actLastFill){ _actLastChange = now; _actLastFill = fill; }
    var stagn = Math.floor((now - _actLastChange)/1000);
    var status = force==='idle' ? 'idle' : (total===0 ? 'waiting' : (fill>0 ? 'working' : 'waiting'));
    var s = window._activeStudent;
    await window.sb.from('student_activity_status').upsert({
      student_id: s.id,
      academy_id: window._acadId,
      class_id: s.class_id || null,
      status: status,
      fill_count: fill,
      total_fill: total,
      stagnation_sec: stagn,
      current_title: '워크북 수행',
      last_input_at: new Date(_actLastChange).toISOString(),
      updated_at: new Date().toISOString()
    }, { onConflict:'student_id' });
  }catch(e){ /* 관제 보고는 best-effort */ }
}
async function boot(){
  await loadBrand();
  // 미리보기 모드
  var pv = new URLSearchParams(location.search).get('preview');
  if(pv && NAV[pv]){ ST.preview=true; ST.role=pv; ST.user=null; renderShell(); return; }
  // 세션 확인
  if(sb){
    try{
      var { data } = await sb.auth.getSession();
      if(data && data.session){ await afterAuth(data.session.user); return; }
    }catch(e){}
  }
  // 로그인 화면
  document.getElementById('gate').classList.remove('hidden');
}

/* ---- 이벤트 ---- */
document.getElementById('g-go').onclick=doLogin;
document.getElementById('g-pw').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('s-out').onclick=async function(){ if(sb){ try{await sb.auth.signOut();}catch(e){} } location.reload(); };
document.getElementById('mob-toggle').onclick=function(){ document.getElementById('side').classList.toggle('open'); };
boot();
</script>

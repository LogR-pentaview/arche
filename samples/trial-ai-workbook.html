const AXES = LESSON.radarAxes;
const AXES_SHORT = AXES.map(a=>a.split('·')[0]);
const state = { answers:{}, scales:{}, radar_before:[5,5,5,5,5], radar_after:[5,5,5,5,5], step:0 };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich = s => (s==null?'':String(s));
const STEPS = [{cover:true}].concat(LESSON.stages.map((s,i)=>({stage:s,i})));
const TOTAL = STEPS.length;
const host=document.getElementById('host'),chipsEl=document.getElementById('chips'),navEl=document.getElementById('nav'),pfill=document.getElementById('pfill');
document.getElementById('gradeChip').textContent=LESSON.gradeBand||'';

function radarPts(vals,cx,cy,r){return vals.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;const rr=r*(v/10);return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];});}
function radarSVG(before,after){
  const cx=150,cy=140,r=95;let g='';
  [0.33,0.66,1].forEach(k=>{const p=radarPts([10,10,10,10,10].map(x=>x*k),cx,cy,r).map(pt=>pt.join(',')).join(' ');g+=`<polygon points="${p}" fill="none" stroke="#dbe3ef" stroke-width="1"/>`;});
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;g+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#dbe3ef" stroke-width="1"/>`;}
  const bp=radarPts(before,cx,cy,r).map(pt=>pt.join(',')).join(' ');
  g+=`<polygon points="${bp}" fill="rgba(148,171,204,.25)" stroke="#94abcc" stroke-width="2"/>`;
  if(after){const ap=radarPts(after,cx,cy,r).map(pt=>pt.join(',')).join(' ');g+=`<polygon points="${ap}" fill="rgba(49,130,246,.26)" stroke="#3182f6" stroke-width="2.5"/>`;}
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;const lx=cx+(r+22)*Math.cos(a),ly=cy+(r+22)*Math.sin(a);g+=`<text x="${lx}" y="${ly}" fill="#4e5968" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">${esc(AXES_SHORT[i])}</text>`;}
  return `<svg viewBox="0 0 300 285">${g}</svg>`;
}
function areaOf(v){let a=0;for(let i=0;i<5;i++){a+=v[i]*v[(i+1)%5];}return a;}

function renderBlock(b){
  const t=b.t||b.type;const d=document.createElement('div');
  if(t==='info'){d.innerHTML=`<div class="infobox">${b.title?`<div class="it">${esc(b.title)}</div>`:''}<div class="ib">${rich(b.body)}</div></div>`;}
  else if(t==='read'){d.innerHTML=`<div class="rc"><div class="who">${esc(b.title||'읽기 자료')}</div><div class="core">${rich(b.body)}</div>${b.source?`<div class="src">— ${esc(b.source)}</div>`:''}</div>`;}
  else if(t==='stats'){d.innerHTML=`<div class="stats">${(b.items||[]).map(it=>`<div class="st"><div class="k">${esc(it.k)}</div><div class="v">${esc(it.v)}</div></div>`).join('')}</div>`;}
  else if(t==='text'){
    const tone=b.tone?(' '+b.tone):'';
    d.innerHTML=`<div class="qbox${tone}"><h4>${esc(b.head||'생각해 보기')}</h4><p>${rich(b.q)}</p>${b.hint?`<div class="hint">✏️ ${esc(b.hint)}</div>`:''}</div>
      <div class="abox"><label>✎ ${esc(b.ansLabel||'내 생각')}</label><textarea rows="${b.rows||4}" placeholder="${esc(b.placeholder||'여기에 생각을 적어 보세요')}">${esc(state.answers[b.id]||'')}</textarea></div>`;
    const ta=d.querySelector('textarea');ta.addEventListener('input',()=>{state.answers[b.id]=ta.value;});
  }
  else if(t==='choice'){
    const multi=!!b.multi;
    let h=`<div class="q">${esc(b.q)}</div>${b.hint?`<div class="qhint">${esc(b.hint)}</div>`:''}<div class="opts">`;
    (b.options||[]).forEach(o=>{const cur=state.answers[b.id];const on=multi?(Array.isArray(cur)&&cur.indexOf(o.v)>=0):(cur===o.v);
      h+=`<div class="opt${on?' on':''}" data-v="${esc(o.v)}"><div class="ol">${esc(o.label)}</div>${o.desc?`<div class="od">${esc(o.desc)}</div>`:''}</div>`;});
    d.innerHTML=h+'</div>';
    d.querySelectorAll('.opt').forEach(op=>op.addEventListener('click',()=>{const v=op.getAttribute('data-v');
      state.answers[b.id]=v;d.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));op.classList.add('on');}));
  }
  else if(t==='scale'){
    const cur=(state.scales[b.id]!=null)?state.scales[b.id]:Math.round(((b.min||0)+(b.max||100))/2);
    state.scales[b.id]=cur;
    d.innerHTML=`<div class="scalebox"><div class="sq">${esc(b.q)}</div>
      <div class="ends"><span class="l">◀ ${esc(b.minLabel||'')}</span><span class="r">${esc(b.maxLabel||'')} ▶</span></div>
      <input type="range" min="${b.min||0}" max="${b.max||100}" value="${cur}">
      <div class="val">현재 위치: <b id="sv_${esc(b.id)}">${cur}</b> / ${b.max||100}</div></div>`;
    const rg=d.querySelector('input'),sv=d.querySelector('#sv_'+b.id);
    rg.addEventListener('input',()=>{state.scales[b.id]=+rg.value;if(sv)sv.textContent=rg.value;});
  }
  else if(t==='video'){
    let vid='';try{const u=new URL(b.url);vid=u.searchParams.get('v')||(u.hostname.indexOf('youtu.be')>=0?u.pathname.slice(1):'')||(u.pathname.indexOf('/embed/')>=0?u.pathname.split('/embed/')[1]:'')||'';}catch(e){}
    let emb;
    if(vid){ emb=`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${esc(vid)}" title="${esc(b.title||'')}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`; }
    else { const q=encodeURIComponent(b.search||b.title||''); emb=`<a class="vsearch" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener"><span style="font-size:20px">▶</span> 관련 영상 보러가기 <span style="opacity:.7;font-size:12px">(YouTube)</span></a>`; }
    d.innerHTML=`<div class="videobox">${emb}<div class="vtitle">🎬 ${esc(b.title||'영상')}</div>${b.body?`<div class="vbody">${esc(b.body)}</div>`:''}${b.mission?`<div class="mission">🎯 미션 · ${esc(b.mission)}</div>`:''}
      <div class="abox" style="margin-top:10px"><label>✎ ${esc(b.ansLabel||'관찰·반응')}</label><textarea rows="4" placeholder="${esc(b.placeholder||'')}">${esc(state.answers[b.id]||'')}</textarea></div></div>`;
    const ta=d.querySelector('textarea');ta.addEventListener('input',()=>{state.answers[b.id]=ta.value;});
  }
  else if(t==='radar'){
    const isBefore=b.mode==='before';const arr=isBefore?state.radar_before:state.radar_after;
    let sl='';AXES.forEach((ax,i)=>{sl+=`<div class="frq" data-i="${i}"><div class="top"><b>${esc(ax)}</b><span class="v">${arr[i]}</span></div><input type="range" min="0" max="10" value="${arr[i]}"></div>`;});
    const legend=isBefore?'':`<div class="legend"><span><span class="sw" style="background:#94abcc"></span>탐구 전</span><span><span class="sw" style="background:#3182f6"></span>탐구 후</span></div>`;
    const growth=isBefore?'':`<div class="growth"><div class="p" id="gp">+0%</div><div><div class="t">지성 확장</div><div class="d">파란 면적(지금)이 회색 면적(처음)보다 넓어진 만큼, 사고가 확장된 거예요.</div></div></div>`;
    d.innerHTML=`<div class="q" style="margin-top:8px">${esc(b.q)}</div><div class="radar-wrap"><div id="rsvg">${radarSVG(isBefore?arr:state.radar_before,isBefore?null:arr)}</div>${legend}<div class="sliders">${sl}</div></div>${growth}`;
    d.querySelectorAll('.frq').forEach(row=>{const i=+row.getAttribute('data-i'),rg=row.querySelector('input'),vv=row.querySelector('.v');
      rg.addEventListener('input',()=>{vv.textContent=rg.value;arr[i]=+rg.value;
        d.querySelector('#rsvg').innerHTML=radarSVG(isBefore?arr:state.radar_before,isBefore?null:arr);
        if(!isBefore){const bA=areaOf(state.radar_before)||1;const aA=areaOf(state.radar_after);const pct=Math.round((aA-bA)/bA*100);const gp=d.querySelector('#gp');if(gp)gp.textContent=(pct>=0?'+':'')+pct+'%';}});});
  }
  return d;
}

    <p>답을 받아 적은 게 아니라 — <b>스스로 묻고, 근거를 찾고, 반론을 견디고, 생각을 고쳤습니다.</b><br>이게 펜타의 한 회차예요. 1년이면 <b>이런 탐구 52편</b>이 쌓입니다.</p>
    <div class="rp-gen-box">
      <div class="rp-gen-t">📄 지금 바로 <b>체험 리포트</b>를 받아보세요</div>
      <div class="rp-gen-d">방금 아이가 쓴 답으로, 실제 발행되는 리포트를 그 자리에서 만들어 드려요.</div>
      <input id="rp-name" placeholder="아이 이름 (선택)" maxlength="20">
      <button id="rp-gen" class="rp-gen-btn">📄 체험 리포트 발행하기 →</button>
    </div>
    <div class="card2"><b>부모님은 이걸 받아보십니다</b><br>· 아이의 <b>처음 생각 → 탐구 후 생각</b>이 나란히 남아요 ("A라고 했다가 B로 깊어졌네")<br>· 5대 지성 성장 레이더 <b>Before/After</b>로 변화가 눈에 보여요<br>· 점수가 아니라 <b>생각의 궤적</b>이 기록으로 누적됩니다</div>
    <a href="https://arche.penta-view.com/parent?trial=1" style="display:block;margin-top:18px;background:linear-gradient(135deg,#3182f6,#1A237E);color:#fff;text-decoration:none;border-radius:13px;padding:16px;font-size:16px;font-weight:800;box-shadow:0 8px 22px -8px rgba(49,130,246,.5)">우리 아이도 시작하기 →</a>
    <div style="font-size:12px;color:#8b95a1;margin-top:10px">런칭 기념 · 첫 3개월 반값 · 선착순</div>`;
  const gb=el.querySelector('#rp-gen');
  if(gb) gb.onclick=()=>{ const nm=(el.querySelector('#rp-name').value||'').trim(); state.childName=nm||'우리 아이'; state.step='report'; render(); };
  return el;
}
function renderReport(){
  const el=document.createElement('div');el.className='report';
  const before=state.radar_before,after=state.radar_after;
  const bA=areaOf(before)||1,aA=areaOf(after);
  const pct=Math.round((aA-bA)/bA*100);
  let gi=0,gd=-99;for(let i=0;i<5;i++){const d=after[i]-before[i];if(d>gd){gd=d;gi=i;}}
  const ans=state.answers;
  const has=id=>ans[id]&&String(ans[id]).trim();
  const A=id=>has(id)?esc(ans[id]):'<span class="rp-empty">— 이 항목은 작성하지 않았어요</span>';
  const nm=esc(state.childName||'우리 아이');
  const today=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  el.innerHTML=`
    <div class="rp-badge">체험 리포트 · 미리보기</div>
    <div class="rp-title">${nm} <span>학생</span></div>
    <div class="rp-meta">${esc(LESSON.title)} · ${today}</div>
    <div class="rp-card">
      <div class="rp-h">🧭 사고 주파수 — 탐구 전 · 후</div>
      <div class="rp-radar">${radarSVG(before,after)}</div>
      <div class="legend"><span><span class="sw" style="background:#94abcc"></span>탐구 전</span><span><span class="sw" style="background:#3182f6"></span>탐구 후</span></div>
      <div class="rp-growth"><div class="p">${pct>0?'+'+pct+'%':'✓'}</div><div><div class="t">${pct>0?'지성 확장':'탐구 완료'}</div><div class="d">${gd>0?('특히 <b>'+esc(AXES[gi])+'</b> 영역에서 가장 크게 자랐어요.'):'다섯 관점으로 주제를 고르게 살펴봤어요.'}</div></div></div>
    </div>
    <div class="rp-card">
      <div class="rp-h">💭 생각의 궤적</div>
      <div class="rp-step"><div class="rp-k">처음 생각 (가설)</div><div class="rp-v">${A('hypothesis')}</div></div>
      <div class="rp-arrow">↓</div>
      <div class="rp-step"><div class="rp-k">탐구 중 · 입장의 이동</div><div class="rp-v">${A('mid_reflect')}</div></div>
      <div class="rp-arrow">↓</div>
      <div class="rp-step"><div class="rp-k">최종 결론 (나의 논지)</div><div class="rp-v">${A('project_design')}</div></div>
    </div>
    <div class="rp-card">
      <div class="rp-h">🔍 5대 지성 렌즈로 본 생각</div>
      ${[['eye1','🔢 수학·논리'],['eye2','🔬 과학·기술'],['eye3','🏛 역사·사회'],['eye4','🧠 심리·인지'],['eye5','🎨 예술·디자인']].map(e=>`<div class="rp-lens"><div class="rp-k">${e[1]}</div><div class="rp-v">${A(e[0])}</div></div>`).join('')}
    </div>
    <div class="rp-card">
      <div class="rp-h">💪 반론을 견디다</div>
      <div class="rp-step"><div class="rp-k">예상 반론</div><div class="rp-v">${A('peer_attack')}</div></div>
      <div class="rp-step" style="margin-top:10px"><div class="rp-k">나의 재반론</div><div class="rp-v">${A('peer_defense')}</div></div>
    </div>
    <div class="rp-comment">
      <b>종합 코멘트</b><br>
      ${nm} 학생은 이번 탐구에서 ${pct>0?('사고의 폭이 <b>+'+pct+'%</b> 넓어졌습니다.'):'하나의 주제를 여러 관점으로 넓히고 다듬었습니다.'} 처음 생각을 그대로 두지 않고, 자료를 읽고 다섯 관점으로 따져보며 <b>스스로 논지를 세우고 반론까지 견뎌</b>냈습니다.${has('mid_reflect')?' 특히 탐구 도중 자기 입장을 스스로 조정한 점이 인상적입니다.':''}
      <div class="rp-note">※ 이 리포트는 <b>체험용 미리보기</b>입니다. 정식 구독 시에는 담당 컨설턴트가 검토·확정하고, 회차가 쌓일수록 <b>생각의 궤적과 성장 곡선</b>이 누적됩니다.</div>
    </div>
    <a class="rp-cta" href="https://arche.penta-view.com/parent?trial=1">우리 아이도 이렇게 시작하기 →</a>
    <div class="rp-cta-sub">런칭 기념 · 첫 3개월 반값 · 선착순 100명</div>`;
  return el;
}
function render(){
  // 리포트 뷰 (특수 스텝)
  if(state.step==='report'){
    host.innerHTML='';const rpage=document.createElement('div');rpage.className='page on';rpage.appendChild(renderReport());host.appendChild(rpage);
    window.scrollTo({top:0,behavior:'smooth'});pfill.style.width='100%';chipsEl.innerHTML='';navEl.innerHTML='';
    const back=document.createElement('button');back.className='btn prev';back.textContent='←';back.onclick=()=>{state.step=TOTAL;render();};navEl.appendChild(back);
    const pr=document.createElement('button');pr.className='btn next';pr.textContent='🖨 저장 · 인쇄';pr.onclick=()=>window.print();navEl.appendChild(pr);
    return;
  }
  const st=STEPS[state.step];host.innerHTML='';
  const page=document.createElement('div');page.className='page on';
  if(state.step===TOTAL)page.appendChild(renderDone());
  else if(st.cover)page.appendChild(renderCover());
  else page.appendChild(renderStage(st.stage));
  host.appendChild(page);window.scrollTo({top:0,behavior:'smooth'});
  pfill.style.width=Math.round(state.step/TOTAL*100)+'%';
  chipsEl.innerHTML='';
  LESSON.stages.forEach((s,i)=>{const stepIdx=i+1;const c=document.createElement('div');c.className='chip'+(state.step===stepIdx?' on':(state.step>stepIdx?' done':''));
    c.innerHTML=`<span class="fn">${s.icon}</span>${esc((s.name.split('·')[1]||s.name).trim())}`;
    c.addEventListener('click',()=>{state.step=stepIdx;render();});chipsEl.appendChild(c);});
  navEl.innerHTML='';
  if(state.step>0&&state.step<=TOTAL){const p=document.createElement('button');p.className='btn prev';p.textContent='←';p.onclick=()=>{if(state.step>0){state.step--;render();}};navEl.appendChild(p);}
  if(state.step<TOTAL-1){const n=document.createElement('button');n.className='btn next';n.textContent=state.step===0?'탐구 시작 →':'다음 단계 →';n.onclick=()=>{state.step++;render();};navEl.appendChild(n);}
  else if(state.step===TOTAL-1){const sb=document.createElement('button');sb.className='btn submit';sb.textContent='🌟 '+LESSON.submit.label;sb.onclick=()=>{state.step=TOTAL;render();};navEl.appendChild(sb);}
  else{const r=document.createElement('button');r.className='btn next';r.textContent='처음부터 다시 보기';r.onclick=()=>{state.step=0;render();};navEl.appendChild(r);}
}
render();
</script>
</body>
</html>

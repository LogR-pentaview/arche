<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 취소</title>
<style>
  html,body{margin:0;height:100%}
  body{font-family:Pretendard,-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif;background:#f5f6f8;color:#4e5968;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
  .c{max-width:320px}
  .ic{font-size:42px;line-height:1}
  .t{font-size:17px;font-weight:800;color:#191f28;margin:14px 0 6px}
  .s{font-size:13.5px;line-height:1.65}
  .b{display:inline-block;margin-top:20px;background:#141a29;color:#fff;text-decoration:none;border:none;border-radius:12px;padding:13px 26px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
  <div class="c">
    <div class="ic">🛒</div>
    <div class="t">결제를 취소했어요</div>
    <div class="s">결제가 진행되지 않았습니다.<br>이전 화면으로 돌아갑니다…</div>
    <button class="b" id="closeBtn" type="button">돌아가기</button>
  </div>
<script>
/* 결제 취소 복귀 페이지 — 앱(대시보드)을 재로딩하지 않는다.
   토스 결제창은 기기/결제수단에 따라 (A) 별도 창/웹뷰 또는 (B) 앱 위 iframe 오버레이로 뜬다.
   두 경우 모두 이 페이지가 결제창 안에 로드되므로, 여기서 결제창만 제거/닫아 원래 화면으로 복귀시킨다. */
(function(){
  function inIframe(){ try{ return window.self !== window.top; }catch(e){ return true; } }

  // (B) 오버레이 iframe으로 뜬 경우: 같은 오리진이므로 부모 앱 DOM에서 결제 오버레이를 제거
  //     → 앱을 다시 로딩하지 않고, 뒤에 있던 원래 화면(상품담기/장바구니)이 그대로 드러난다.
  function removeOverlay(){
    try{
      var fe = window.frameElement; // 우리 iframe 요소(같은 오리진이라 접근 가능)
      if(!fe) return false;
      var winTop = (fe.ownerDocument && fe.ownerDocument.defaultView) || window.parent;
      // iframe에서 위로 올라가며 '고정 위치/높은 z-index' 오버레이 컨테이너(토스 백드롭)를 찾아 통째로 제거
      var container = fe, p = fe.parentElement, hops = 0;
      while(p && p.tagName && p.tagName.toLowerCase() !== 'body' && hops < 8){
        var cs = null; try{ cs = winTop.getComputedStyle(p); }catch(e){}
        if(cs && (cs.position === 'fixed' || (parseInt(cs.zIndex,10)||0) >= 1000)) container = p;
        p = p.parentElement; hops++;
      }
      if(container && container.parentNode){ container.parentNode.removeChild(container); return true; }
      if(fe.parentNode){ fe.parentNode.removeChild(fe); return true; }
    }catch(e){}
    return false;
  }

  // 부모 앱에 취소를 알려, 앱이 자기 DOM에서 토스 오버레이(iframe)를 직접 제거하도록 함(가장 안전)
  function signalParent(){
    try{ (window.top || window.parent).postMessage({ type:'arche-pay-cancel' }, location.origin); return true; }catch(e){ return false; }
  }

  // (A) 별도 창/웹뷰로 뜬 경우: 창 닫기
  function closeWindow(){
    try{ window.close(); }catch(e){}
    try{ window.open('', '_self', ''); window.close(); }catch(e){}
    return true;
  }

  function goBack(){
    if(inIframe()){ signalParent(); removeOverlay(); return; }
    closeWindow();
  }

  document.getElementById('closeBtn').addEventListener('click', goBack);
  // 진입 즉시 자동 복귀 시도
  setTimeout(goBack, 120);
})();
</script>
</body>
</html>

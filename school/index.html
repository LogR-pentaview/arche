<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>펜타비전 · 학교 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#1A237E;--gold:#C8A24A;--ink:#191f28;--dim:#4e5968;--mute:#8b95a1;--line:#e5e8ec;--bg:#eef1f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(26,35,126,.08)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand h1{font-size:17px;margin:0;color:var(--navy)}
.sub{color:var(--mute);font-size:12.5px;margin:2px 0 18px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:9px}
.btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.msg{font-size:12.5px;padding:9px 11px;border-radius:9px;margin-top:10px}
.msg.err{background:#fdecec;color:#c0392b}.msg.ok{background:#e8f6ee;color:#1c7a45}
.hint{color:var(--mute);font-size:11.5px;margin-top:14px;line-height:1.6}
</style>
</head><body>
<div class="card">
  <div class="brand"><div class="mk">P</div><h1>펜타비전 학교</h1></div>
  <div class="sub">교사 · 학생 · 관리자 로그인</div>
  <input class="inp" id="lg-id" placeholder="아이디 또는 이메일" autocomplete="username">
  <input class="inp" id="lg-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn" id="lg-btn" onclick="doLogin()">로그인</button>
  <div id="lg-msg"></div>
  <div class="hint">· 교사·학생: 발급받은 아이디로 로그인<br>· 관리자: 이메일로 로그인<br>· 로그인 후 각자 화면으로 자동 이동합니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/config.js"></script>
<script>
var SBU=window.SB_URL||'https://dvxepjctjazobrkjrkdw.supabase.co';
var SBK=window.SB_KEY||'';
var sb=(window.supabase&&SBK)?window.supabase.createClient(SBU,SBK):null;
function el(id){return document.getElementById(id);}
function msg(t,ok){var m=el('lg-msg');m.className='msg '+(ok?'ok':'err');m.textContent=t;}

async function routeByRole(){
  // 관리자 → 관리자 콘솔 / 그 외(교사·학생·학부모) → 학원앱
  try{
    var {data:{user}}=await sb.auth.getUser();
    if(user){
      var a=await sb.from('academies').select('is_admin').eq('owner_uid',user.id).eq('is_admin',true).limit(1);
      if(a&&a.data&&a.data.length){ location.href='/admin/'; return; }
    }
  }catch(e){}
  location.href='/academy/';
}
async function boot(){
  if(!sb){ msg('설정 로드 실패 — 새로고침 해주세요'); return; }
  var {data:{session}}=await sb.auth.getSession();
  if(session){ el('lg-msg').className='msg ok'; el('lg-msg').textContent='로그인됨 — 이동 중…'; routeByRole(); }
}
async function doLogin(){
  var idv=(el('lg-id').value||'').trim(); var pw=el('lg-pw').value||'';
  if(!idv||!pw){ msg('아이디와 비밀번호를 입력하세요.'); return; }
  var email=(idv.indexOf('@')>0)?idv:(idv.toLowerCase()+'@stu.penta-view.com');
  el('lg-btn').disabled=true; el('lg-msg').className='msg'; el('lg-msg').textContent='로그인 중…';
  var r=await sb.auth.signInWithPassword({email:email,password:pw});
  if(r.error){ el('lg-btn').disabled=false; msg('로그인 실패: '+r.error.message); return; }
  msg('로그인 성공 — 이동 중…', true); routeByRole();
}
el('lg-pw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
boot();
</script>
</body></html>
